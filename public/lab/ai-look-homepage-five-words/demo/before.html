<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작심 — AI 티 버전</title>
<!--
  교육용 '전' 화면. 특정 AI의 실제 결과물이 아니다.
  디자인 글들이 꼽은 'AI 티' 신호를 일부러 모아 재현했다(출처: Paralect "Signs of AI slop in design" 21개 중
  #2 모든 칸에 테두리, #9 이모지 아이콘, #15 같은 둥글기·그림자 반복, #16 옅은 회색 글자, #20 보라 그라디언트, #21 네온 빛,
  그리고 여러 글이 공통으로 꼽은 '가운데 정렬 첫 화면 + 알약 배지 + 똑같은 카드 3장 + 유행어 문구').
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Inter, "Segoe UI", sans-serif; background: #0f0b1e; color: #fff; text-align: center; }
  header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,.15); display: flex; justify-content: space-between; }
  header b { background: linear-gradient(90deg, #a855f7, #3b82f6); -webkit-background-clip: text; color: transparent; }
  .hero { padding: 64px 20px; background: radial-gradient(circle at 50% 0%, rgba(139,92,246,.55), transparent 60%), linear-gradient(135deg, #6d28d9, #2563eb); }
  .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.12); font-size: 13px; }
  h1 { margin-top: 18px; font-size: 44px; background: linear-gradient(90deg, #fff, #c4b5fd, #93c5fd); -webkit-background-clip: text; color: transparent; }
  .hero p { margin: 14px auto 0; max-width: 560px; color: rgba(255,255,255,.55); font-size: 15px; }
  .btn { display: inline-block; margin-top: 24px; padding: 14px 30px; border-radius: 12px; background: linear-gradient(90deg, #a855f7, #3b82f6); color: #fff; font-weight: 700; box-shadow: 0 0 30px rgba(168,85,247,.8); text-decoration: none; }
  .btn2 { display: inline-block; margin: 24px 0 0 10px; padding: 14px 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,.5); color: #fff; text-decoration: none; }
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 40px 20px; }
  .card { padding: 24px; border-radius: 16px; border: 1px solid rgba(168,85,247,.5); background: rgba(255,255,255,.05); box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .card .e { font-size: 34px; }
  .card h3 { margin-top: 10px; font-size: 18px; }
  .card p { margin-top: 8px; color: rgba(255,255,255,.45); font-size: 14px; }
  @media (max-width: 720px) { .features { grid-template-columns: 1fr; } h1 { font-size: 32px; } }
</style>
</head>
<body>
<header><b>작심</b><span>로그인</span></header>
<section class="hero">
  <span class="badge">✨ AI 기반 습관 혁신 플랫폼</span>
  <h1>습관의 힘을 혁신적으로 경험하세요</h1>
  <p>작심은 최첨단 AI 기술로 당신의 잠재력을 최대한 발휘할 수 있도록 원활하고 강력한 습관 관리 경험을 제공합니다.</p>
  <a class="btn" href="#">🚀 지금 시작하기</a><a class="btn2" href="#">더 알아보기</a>
</section>
<section class="features">
  <div class="card"><div class="e">📊</div><h3>스마트 분석</h3><p>AI가 당신의 습관을 분석하여 인사이트를 제공합니다.</p></div>
  <div class="card"><div class="e">🔔</div><h3>똑똑한 알림</h3><p>최적의 타이밍에 알림을 보내 습관 형성을 돕습니다.</p></div>
  <div class="card"><div class="e">🏆</div><h3>보상 시스템</h3><p>목표를 달성하면 보상을 받아 동기부여를 유지합니다.</p></div>
</section>
</body>
</html>
