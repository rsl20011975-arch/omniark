<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작심 — 하루 한 줄이면 습관이 남습니다</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg: #FAFAF8;
    --ink: #1C1C1A;
    --brand: #E8562C;

    --card: #FFFFFF;
    --ink-soft: rgba(28,28,26,0.62);
    --ink-faint: rgba(28,28,26,0.38);
    --brand-soft: rgba(232,86,44,0.08);
    --brand-line: rgba(232,86,44,0.18);

    --shadow-flat: 0 1px 2px rgba(28,28,26,0.04), 0 1px 1px rgba(28,28,26,0.03);
    --shadow-hero: 0 20px 40px -12px rgba(28,28,26,0.18), 0 8px 16px -8px rgba(232,86,44,0.12);
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
  }

  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- Nav ---------- */
  nav.wrap{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 28px;
    padding-bottom: 28px;
  }
  .logo{
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .logo span{ color: var(--brand); }

  .nav-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
  }
  .nav-link:hover{ color: var(--ink); }
  .nav-link svg{ width: 16px; height: 16px; }

  /* ---------- Hero ---------- */
  .hero{
    padding: 56px 0 72px;
    text-align: left;
  }
  .eyebrow{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--brand);
    background: var(--brand-soft);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 20px;
  }
  .eyebrow svg{ width: 14px; height: 14px; }

  h1{
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.3;
    margin: 0 0 20px;
    max-width: 640px;
  }

  .lead{
    font-size: 17px;
    color: var(--ink-soft);
    max-width: 480px;
    margin: 0 0 32px;
  }

  .cta-row{
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .btn-primary{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--brand);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    cursor: pointer;
    box-shadow: var(--shadow-flat);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary:hover{
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(232,86,44,0.28);
  }
  .btn-primary svg{ width: 18px; height: 18px; }

  .link-secondary{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1.5px solid var(--ink-faint);
    padding-bottom: 2px;
  }
  .link-secondary:hover{ border-color: var(--ink); }
  .link-secondary svg{ width: 16px; height: 16px; }

  /* ---------- Features ---------- */
  .features{
    padding-bottom: 96px;
  }

  .hero-card{
    background: var(--card);
    border-radius: 24px;
    padding: 40px;
    box-shadow: var(--shadow-hero);
    display: flex;
    align-items: center;
    gap: 36px;
    margin-bottom: 20px;
  }

  .hero-card .icon-wrap{
    flex: 0 0 auto;
    width: 96px;
    height: 96px;
    border-radius: 20px;
    background: var(--brand-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-card .icon-wrap svg{
    width: 48px;
    height: 48px;
    color: var(--brand);
    stroke-width: 1.75;
  }

  .hero-card .text h2{
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .hero-card .text p{
    font-size: 15.5px;
    color: var(--ink-soft);
    margin: 0;
    max-width: 440px;
  }
  .hero-card .streak-badge{
    margin-top: 14px;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    font-weight: 800;
    color: var(--brand);
  }
  .hero-card .streak-badge .num{ font-size: 28px; }
  .hero-card .streak-badge .unit{ font-size: 14px; font-weight: 600; }

  .sub-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .sub-card{
    background: var(--card);
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow-flat);
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .sub-card .icon-wrap{
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--brand-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sub-card .icon-wrap svg{
    width: 22px;
    height: 22px;
    color: var(--brand);
    stroke-width: 1.75;
  }

  .sub-card h3{
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .sub-card p{
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
  }

  /* ---------- Footer ---------- */
  footer.wrap{
    padding: 28px 24px 40px;
    font-size: 13px;
    color: var(--ink-faint);
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px){
    h1{ font-size: 32px; }
    .lead{ font-size: 16px; }
    .hero{ padding: 36px 0 48px; }
    .hero-card{
      flex-direction: column;
      align-items: flex-start;
      padding: 28px;
      gap: 20px;
    }
    .hero-card .icon-wrap{
      width: 72px;
      height: 72px;
    }
    .hero-card .icon-wrap svg{ width: 36px; height: 36px; }
    .sub-grid{
      grid-template-columns: 1fr;
    }
    .cta-row{
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }
    .btn-primary{ width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<nav class="wrap">
  <div class="logo">작심<span>.</span></div>
  <a class="nav-link" href="#how">
    <i data-lucide="book-open"></i>
    어떻게 쓰나요
  </a>
</nav>

<section class="hero wrap">
  <span class="eyebrow">
    <i data-lucide="pencil-line"></i>
    매일 한 줄, 그게 다예요
  </span>
  <h1>하루 한 줄이면<br>습관이 남습니다</h1>
  <p class="lead">오늘 한 일을 한 줄로 적으세요. 작심이 이어진 날을 세어 드립니다.</p>
  <div class="cta-row">
    <button class="btn-primary">
      <i data-lucide="pencil"></i>
      첫 줄 쓰기
    </button>
    <a class="link-secondary" href="#how">
      어떻게 쓰나요
      <i data-lucide="arrow-right"></i>
    </a>
  </div>
</section>

<section class="features wrap">

  <div class="hero-card">
    <div class="icon-wrap">
      <i data-lucide="flame"></i>
    </div>
    <div class="text">
      <h2>이어진 날이 눈에 보입니다</h2>
      <p>한 줄을 쓸 때마다 이어진 날이 쌓여요. 끊기지 않은 날들이 그대로 기록이 됩니다.</p>
      <div class="streak-badge">
        <span class="num">17</span>
        <span class="unit">일째 이어지는 중</span>
      </div>
    </div>
  </div>

  <div class="sub-grid">
    <div class="sub-card">
      <div class="icon-wrap">
        <i data-lucide="bell"></i>
      </div>
      <div>
        <h3>저녁 9시 한 번 알림</h3>
        <p>하루 딱 한 번, 저녁 9시에만 가볍게 알려 드려요.</p>
      </div>
    </div>
    <div class="sub-card">
      <div class="icon-wrap">
        <i data-lucide="download"></i>
      </div>
      <div>
        <h3>내 기록은 텍스트 파일로 내려받기</h3>
        <p>쌓인 한 줄들을 언제든 텍스트 파일로 가져갈 수 있어요.</p>
      </div>
    </div>
  </div>

</section>

<footer class="wrap">
  © 작심. 하루 한 줄로 이어 갑니다.
</footer>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
  lucide.createIcons();
</script>

</body>
</html>
