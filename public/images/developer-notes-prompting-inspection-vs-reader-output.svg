<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="720" viewBox="0 0 1260 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">내부 검수 정보와 독자가 읽을 결과물을 분리하는 흐름</title>
  <desc id="desc">자료 조사와 검수 결과는 내부 검수 레일로, 독자가 읽을 글은 별도의 공개 결과물 레일로 분리되어 있다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1260" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#111427"/><stop offset=".52" stop-color="#0D1223"/><stop offset="1" stop-color="#161025"/></linearGradient>
    <linearGradient id="green" x1="110" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#50D5C9"/><stop offset=".55" stop-color="#69A9FF"/><stop offset="1" stop-color="#BB86FF"/></linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#02030A" flood-opacity=".42"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#CBD8FF" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1260" height="720" rx="26" fill="url(#bg)"/><rect width="1260" height="720" rx="26" fill="url(#grid)"/>
  <circle cx="1120" cy="172" r="210" fill="#8245C5" fill-opacity=".12"/><circle cx="196" cy="612" r="190" fill="#1D9AA1" fill-opacity=".10"/>
  <text x="74" y="82" fill="#AEB8D5" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">CONTENT SYSTEM / ROLE SPLIT</text>
  <text x="74" y="126" fill="#F6F8FF" font-family="Pretendard, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-1.3">좋은 검수와 좋은 글은 같은 화면이 아닙니다</text>
  <g filter="url(#drop)"><rect x="74" y="170" width="242" height="126" rx="20" fill="#1D2940" stroke="#63B4FF" stroke-opacity=".46"/><text x="102" y="214" fill="#B7DCFF" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.2">INPUT</text><text x="102" y="255" fill="#F2F7FF" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="800">자료 조사</text><text x="102" y="280" fill="#9BB0CE" font-family="Pretendard, Arial, sans-serif" font-size="15">출처 · 발췌 · 비교</text></g>
  <path d="M330 233H409" stroke="#6C91D0" stroke-width="3" stroke-linecap="round"/><path d="M400 218L421 233L400 248" stroke="#6C91D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#drop)"><rect x="432" y="170" width="242" height="126" rx="20" fill="#213249" stroke="#68E1D7" stroke-opacity=".46"/><text x="460" y="214" fill="#A4F5EE" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.2">CHECK</text><text x="460" y="255" fill="#F3FFFE" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="800">근거 확인</text><text x="460" y="280" fill="#9AC7C4" font-family="Pretendard, Arial, sans-serif" font-size="15">사실 · 누락 · 위험 신호</text></g>
  <path d="M688 233H767" stroke="#6E90D2" stroke-width="3" stroke-linecap="round"/><path d="M758 218L779 233L758 248" stroke="#6E90D2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#drop)"><rect x="790" y="170" width="396" height="126" rx="20" fill="#2B2045" stroke="#CD95FF" stroke-opacity=".46"/><text x="818" y="214" fill="#E2BFFF" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.2">INTERNAL ONLY</text><text x="818" y="255" fill="#FFF6FF" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="800">검수 메모 · 상태 · 근거 목록</text><text x="818" y="280" fill="#C2A8D6" font-family="Pretendard, Arial, sans-serif" font-size="15">운영자가 확인할 정보입니다</text></g>
  <path d="M929 318V370" stroke="#7D6FA3" stroke-width="3" stroke-dasharray="6 9"/><path d="M914 358L929 379L944 358" stroke="#9C89C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="74" y="366" fill="#7790B8" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">독자에게 내보내는 길</text>
  <path d="M104 412H1152" stroke="url(#green)" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#drop)"><rect x="74" y="446" width="1112" height="174" rx="24" fill="#121D32" stroke="#80EFE4" stroke-opacity=".38"/><rect x="103" y="479" width="108" height="34" rx="17" fill="#164550"/><text x="123" y="502" fill="#A4FCF3" font-family="Pretendard, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1">PUBLIC</text><text x="103" y="556" fill="#F5FBFF" font-family="Pretendard, Arial, sans-serif" font-size="30" font-weight="800">독자가 읽을 완성된 글</text><text x="103" y="590" fill="#ACC1DB" font-family="Pretendard, Arial, sans-serif" font-size="17">문제, 실제 선택, 배운 점, 다음에 확인할 기준. 내부 검수 보고서가 아니라 읽는 사람을 위한 결과물.</text><rect x="932" y="506" width="219" height="68" rx="16" fill="#1E3145" stroke="#73E5DB" stroke-opacity=".4"/><text x="958" y="535" fill="#A5F6F0" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="800">분리의 기준</text><text x="958" y="559" fill="#D9EDFF" font-family="Pretendard, Arial, sans-serif" font-size="14">“독자에게 필요한가?”</text></g>
  <text x="74" y="677" fill="#8392B2" font-family="Pretendard, Arial, sans-serif" font-size="15">검수는 글을 지키고, 글은 독자의 질문에 답합니다. 둘은 협력하지만 같은 역할은 아닙니다.</text>
</svg>
