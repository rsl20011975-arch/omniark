<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">묶음 예약과 발행 직전 가드</title><desc id="desc">하나의 예약이 여러 결과물을 연속으로 내보내는 경로와, 실제 발행 직전에 최근 공개 이력으로 제한하는 경로를 비교한다.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#241a1b"/><stop offset="1" stop-color="#263322"/></linearGradient><linearGradient id="guard" x1="0" x2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#090604" flood-opacity=".5"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="116" fill="#fffaf5" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">생산 묶음의 크기와 공개 속도는 같은 값이 아니다</text><text x="102" y="164" fill="#e3cfc7" font-family="Pretendard, Arial, sans-serif" font-size="24">예약은 여러 개를 만들 수 있다. 하지만 공개는 마지막 단계에서 최신 이력과 다시 대조해야 한다.</text><g filter="url(#s)" font-family="Pretendard, Arial, sans-serif"><rect x="100" y="270" width="560" height="400" rx="30" fill="#4b2930" stroke="#fda4af" stroke-opacity=".7"/><text x="140" y="334" fill="#ffcbd0" font-size="19" font-weight="700">가드가 없을 때</text><text x="140" y="396" fill="#fff7f8" font-size="32" font-weight="700">예약 묶음 → 연속 공개</text><g fill="#743e4a"><rect x="140" y="462" width="130" height="80" rx="15"/><rect x="295" y="462" width="130" height="80" rx="15"/><rect x="450" y="462" width="130" height="80" rx="15"/></g><g fill="#ffe1e5" font-size="22" font-weight="700"><text x="184" y="512">①</text><text x="339" y="512">②</text><text x="494" y="512">③</text></g><text x="140" y="616" fill="#ffc6cf" font-size="20">간격 없는 묶음 값이 외부 공개까지 밀어냄</text><rect x="940" y="270" width="560" height="400" rx="30" fill="#23463b" stroke="#6ee7b7" stroke-opacity=".72"/><text x="980" y="334" fill="#bdf7d1" font-size="19" font-weight="700">발행 직전 가드</text><text x="980" y="396" fill="#f4fff7" font-size="32" font-weight="700">최근 공개 이력 → 보류</text><rect x="980" y="452" width="480" height="72" rx="16" fill="#315f51"/><text x="1011" y="498" fill="#d9fbe6" font-size="23" font-weight="600">오늘의 공개 이력 · 간격 · 상한 확인</text><path d="M1220 540v48" stroke="url(#guard)" stroke-width="5" stroke-linecap="round"/><path d="M1203 571l17 22 17-22" fill="none" stroke="#d8fff0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="980" y="630" fill="#aaf0c6" font-size="20">기준에 닿으면 새 작업을 만들지 않고 건너뜀</text></g><path d="M691 470h177" stroke="#fff0d7" stroke-width="5" stroke-linecap="round"/><path d="M835 450l32 20-32 20" fill="none" stroke="#fff0d7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="748" width="1400" height="72" rx="22" fill="#2b2d25" stroke="#8b9675" stroke-opacity=".6"/><text x="140" y="795" fill="#f7ffed" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="600">핵심: 상한이 걸린 날은 글·영상·이미지를 다 만든 뒤 실패시키지 않는다. 공개 가능 여부를 생성보다 먼저 묻는다.</text></svg>
