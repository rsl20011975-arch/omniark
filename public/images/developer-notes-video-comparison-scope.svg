<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">비교 영상 사건 시간선</title><desc id="desc">제목 약속, 비교 조건 이탈, 범위 고정, 영상 QA 실패를 분리한 시간선</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#291817"/><stop offset="1" stop-color="#14242c"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="22"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1430" cy="740" r="240" fill="#ff8d55" opacity=".12" filter="url(#g)"/>
<text x="110" y="124" fill="#ffc078" font-family="Noto Sans KR, sans-serif" font-size="22" font-weight="700" letter-spacing="5">VIDEO COMPARISON / POSTMORTEM</text><text x="110" y="204" fill="#fff5ec" font-family="Noto Sans KR, sans-serif" font-size="58" font-weight="700">보이는 비교가, 같은 비교는 아니었다</text>
<text x="110" y="252" fill="#c6b6ad" font-family="Noto Sans KR, sans-serif" font-size="24">조건을 고쳤어도 완성본 QA는 별도로 실패할 수 있다는 실제 제작 기록</text>
<g font-family="Noto Sans KR, sans-serif"><g transform="translate(110 350)"><rect width="330" height="315" rx="20" fill="#30241f" stroke="#765b4c"/><text x="28" y="56" fill="#ffc078" font-size="20" font-weight="700">01 / 제목의 약속</text><text x="28" y="120" fill="#fff5ec" font-size="34" font-weight="700">“비슷한 제품”</text><text x="28" y="170" fill="#c6b6ad" font-size="21">독자는 같은 범주와 쓰임을</text><text x="28" y="202" fill="#c6b6ad" font-size="21">비교한다고 이해한다</text></g>
<g transform="translate(465 350)"><rect width="330" height="315" rx="20" fill="#392522" stroke="#e48260"/><text x="28" y="56" fill="#ffb9a2" font-size="20" font-weight="700">02 / 이탈 발견</text><text x="28" y="120" fill="#fff5ec" font-size="34" font-weight="700">다른 형태를 병치</text><text x="28" y="170" fill="#c6b6ad" font-size="21">한 장면의 대비가</text><text x="28" y="202" fill="#c6b6ad" font-size="21">질문의 조건을 바꿨다</text></g>
<g transform="translate(820 350)"><rect width="330" height="315" rx="20" fill="#23312f" stroke="#6a9f91"/><text x="28" y="56" fill="#a9e4d0" font-size="20" font-weight="700">03 / 범위 고정</text><text x="28" y="120" fill="#fff5ec" font-size="34" font-weight="700">조건·근거 묶기</text><text x="28" y="170" fill="#c6b6ad" font-size="21">형태·크기·색·재질을</text><text x="28" y="202" fill="#c6b6ad" font-size="21">같은 규칙으로 제한했다</text></g>
<g transform="translate(1175 350)"><rect width="315" height="315" rx="20" fill="#342a23" stroke="#d99b5c"/><text x="28" y="56" fill="#ffd097" font-size="20" font-weight="700">04 / QA 실패</text><text x="28" y="120" fill="#fff5ec" font-size="34" font-weight="700">전체 영상 측정</text><text x="28" y="178" fill="#ffd097" font-size="25" font-weight="700">정지 87% · 68%</text><text x="28" y="218" fill="#c6b6ad" font-size="20">10초당 컷 1.0 · 1.1</text><text x="28" y="258" fill="#c6b6ad" font-size="20">완료 ≠ 품질 통과</text></g></g>
<text x="110" y="775" fill="#f0ded1" font-family="Noto Sans KR, sans-serif" font-size="27">제목의 약속 → 비교 조건 → 근거 한계 → 완성본 QA. 어느 한 단계도 다음 단계를 대신하지 않는다.</text>
</svg>
