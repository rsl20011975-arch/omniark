<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">저장된 설정과 실행 중인 데몬 설정의 시간차</title>
  <desc id="desc">대시보드와 파일은 새 설정을 보지만, 이미 시작된 데몬은 이전 메모리 상태를 실행할 수 있음을 보여 준다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1821"/><stop offset="1" stop-color="#202a4c"/></linearGradient>
    <linearGradient id="new" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="old" x1="0" x2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="160" cy="150" r="230" fill="#0ea5e9" opacity=".1"/><circle cx="1420" cy="730" r="290" fill="#fb7185" opacity=".08"/>
  <text x="100" y="116" fill="#eefaff" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">저장된 설정과 실행 중인 설정은 같은 시간이 아니다</text>
  <text x="102" y="164" fill="#b6cede" font-family="Pretendard, Arial, sans-serif" font-size="24">파일·대시보드·데몬 메모리·발화 기록을 따로 보지 않으면, 변경이 적용된 것처럼 보일 수 있다.</text>
  <g filter="url(#s)" font-family="Pretendard, Arial, sans-serif">
    <rect x="100" y="274" width="520" height="344" rx="30" fill="#183749" stroke="#5eead4" stroke-opacity=".65"/><rect x="140" y="315" width="158" height="38" rx="19" fill="url(#new)"/><text x="170" y="341" fill="#07322b" font-size="17" font-weight="700">저장된 현재</text><text x="140" y="414" fill="#f3fffd" font-size="34" font-weight="700">대시보드 · 설정 파일</text><text x="140" y="457" fill="#c5e5df" font-size="21">새 규칙이 저장되고 화면에 보임</text><rect x="140" y="502" width="440" height="70" rx="15" fill="#235568"/><text x="169" y="546" fill="#c5f7ed" font-size="23" font-weight="600">“저장 성공”</text>
    <rect x="980" y="274" width="520" height="344" rx="30" fill="#4a2938" stroke="#fda4af" stroke-opacity=".7"/><rect x="1020" y="315" width="158" height="38" rx="19" fill="url(#old)"/><text x="1053" y="341" fill="#42131d" font-size="17" font-weight="700">실행 중인 과거</text><text x="1020" y="414" fill="#fff6f7" font-size="34" font-weight="700">이미 시작된 데몬</text><text x="1020" y="457" fill="#ead0d7" font-size="21">시작할 때 읽은 이전 규칙을 유지</text><rect x="1020" y="502" width="440" height="70" rx="15" fill="#633749"/><text x="1049" y="546" fill="#ffd9df" font-size="23" font-weight="600">“이전 규칙으로 발화”</text>
  </g>
  <path d="M632 444h307" stroke="#dceeff" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 13"/><path d="M905 426l31 18-31 18" fill="none" stroke="#dceeff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="682" y="398" fill="#d8eafa" font-family="Pretendard, Arial, sans-serif" font-size="21" font-weight="600">재기동 또는 재동기화의 다리</text>
  <g filter="url(#s)" font-family="Pretendard, Arial, sans-serif"><rect x="355" y="684" width="890" height="104" rx="26" fill="#1d3141" stroke="#7dd3fc" stroke-opacity=".65"/><text x="398" y="729" fill="#b7e6fb" font-size="19" font-weight="700">확인은 화면이 아니라 실행 결과까지</text><text x="398" y="766" fill="#effbff" font-size="27" font-weight="700">재기동 후, 새 조건에 맞는 예약만 한 번 발화했는가?</text></g>
</svg>
