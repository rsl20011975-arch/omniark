<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">첫 화면 네 장과 전체 글 60편의 발견성 차이</title>
  <desc id="desc">왼쪽은 첫 화면에 글 카드 네 장만 보이는 경로, 오른쪽은 전체 글 목록과 정적 대체 경로를 함께 둔 개선 경로다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#142544"/></linearGradient>
    <linearGradient id="warm" x1="0" x2="1"><stop stop-color="#ffbd6b"/><stop offset="1" stop-color="#fa7185"/></linearGradient>
    <linearGradient id="cool" x1="0" x2="1"><stop stop-color="#54d6bf"/><stop offset="1" stop-color="#77a8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".42"/></filter>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="9" cy="15" r="1" fill="#fff" opacity=".05"/><circle cx="51" cy="41" r="1" fill="#fff" opacity=".035"/><circle cx="28" cy="68" r="1" fill="#fff" opacity=".04"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grain)"/>
  <text x="100" y="118" fill="#e9f2ff" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">콘텐츠 수와 발견 가능한 콘텐츠는 다르다</text>
  <text x="102" y="166" fill="#a9bbd7" font-family="Pretendard, Arial, sans-serif" font-size="24">같은 60편의 글도, 첫 화면의 탐색 경로가 다르면 전혀 다르게 읽힌다.</text>
  <g filter="url(#shadow)">
    <rect x="100" y="230" width="610" height="520" rx="30" fill="#111e33" stroke="#5c718f" stroke-opacity=".42"/>
    <rect x="140" y="270" width="160" height="42" rx="21" fill="url(#warm)"/>
    <text x="169" y="299" fill="#261228" font-family="Pretendard, Arial, sans-serif" font-size="19" font-weight="700">처음 보인 길</text>
    <text x="140" y="368" fill="#f6f8fb" font-family="Pretendard, Arial, sans-serif" font-size="34" font-weight="700">첫 화면: 카드 4장</text>
    <text x="140" y="407" fill="#b8c6dc" font-family="Pretendard, Arial, sans-serif" font-size="21">총 글 수 표시 없음 · 다음 경로가 약함</text>
    <g fill="#213552" stroke="#90a8c8" stroke-opacity=".55">
      <rect x="140" y="456" width="250" height="104" rx="16"/><rect x="418" y="456" width="250" height="104" rx="16"/>
      <rect x="140" y="585" width="250" height="104" rx="16"/><rect x="418" y="585" width="250" height="104" rx="16"/>
    </g>
    <g fill="#b8c6dc"><rect x="162" y="478" width="126" height="10" rx="5"/><rect x="162" y="504" width="178" height="8" rx="4"/><rect x="440" y="478" width="132" height="10" rx="5"/><rect x="440" y="504" width="166" height="8" rx="4"/><rect x="162" y="607" width="122" height="10" rx="5"/><rect x="162" y="633" width="164" height="8" rx="4"/><rect x="440" y="607" width="134" height="10" rx="5"/><rect x="440" y="633" width="160" height="8" rx="4"/></g>
    <text x="140" y="722" fill="#ffcf91" font-family="Pretendard, Arial, sans-serif" font-size="20" font-weight="600">60편의 축적은 화면 밖에 남아 있었다</text>
  </g>
  <path d="M748 490h91" stroke="#e6eefc" stroke-width="4" stroke-linecap="round"/><path d="M820 472l28 18-28 18" fill="none" stroke="#e6eefc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="890" y="230" width="610" height="520" rx="30" fill="#102536" stroke="#6ed6c2" stroke-opacity=".5"/>
    <rect x="930" y="270" width="182" height="42" rx="21" fill="url(#cool)"/>
    <text x="959" y="299" fill="#082823" font-family="Pretendard, Arial, sans-serif" font-size="19" font-weight="700">다시 만든 길</text>
    <text x="930" y="368" fill="#f6f8fb" font-family="Pretendard, Arial, sans-serif" font-size="34" font-weight="700">4장 + 전체 목록 경로</text>
    <text x="930" y="407" fill="#b8d6d3" font-family="Pretendard, Arial, sans-serif" font-size="21">동적 목록과 정적 대체 경로를 함께 유지</text>
    <rect x="930" y="452" width="530" height="62" rx="14" fill="#163c46"/><text x="958" y="491" fill="#b8f0e5" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="600">전체 글 목록 · 최신순 · 60개 링크</text>
    <g fill="#214c55"><rect x="930" y="544" width="530" height="34" rx="10"/><rect x="930" y="592" width="530" height="34" rx="10"/><rect x="930" y="640" width="530" height="34" rx="10"/></g>
    <g fill="#c5ece6"><circle cx="955" cy="561" r="6"/><circle cx="955" cy="609" r="6"/><circle cx="955" cy="657" r="6"/><rect x="978" y="555" width="306" height="11" rx="5.5"/><rect x="978" y="603" width="369" height="11" rx="5.5"/><rect x="978" y="651" width="284" height="11" rx="5.5"/></g>
    <text x="930" y="722" fill="#8ce2d2" font-family="Pretendard, Arial, sans-serif" font-size="20" font-weight="600">목록 추가의 심사 효과는 아직 증명하지 않았다</text>
  </g>
  <text x="100" y="835" fill="#91a6c7" font-family="Pretendard, Arial, sans-serif" font-size="19">측정의 핵심: 관리 화면의 수치가 아니라, 방문자가 첫 화면에서 실제로 따라갈 수 있는 경로를 센다.</text>
</svg>
