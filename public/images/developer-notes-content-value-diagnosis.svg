<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">콘텐츠 가치 결과 진단 지도</title><desc id="desc">모호한 심사 결과를 기술 경로, 발견성, 원고 품질로 나누고 인과를 유보하는 흐름도</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151328"/><stop offset="1" stop-color="#1b2624"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="22"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="110" cy="770" r="270" fill="#7779ff" opacity=".11" filter="url(#g)"/>
<text x="110" y="124" fill="#bcbcff" font-family="Noto Sans KR, sans-serif" font-size="22" font-weight="700" letter-spacing="5">CONTENT VALUE / INVESTIGATION</text><text x="110" y="204" fill="#f5f3ff" font-family="Noto Sans KR, sans-serif" font-size="58" font-weight="700">모호한 결과를, 고칠 수 있는 층으로 나눴다</text>
<text x="110" y="252" fill="#bdb9ce" font-family="Noto Sans KR, sans-serif" font-size="24">원인을 아는 척하지 않고 관찰 가능한 세 갈래를 따로 점검한 운영 기록</text>
<g font-family="Noto Sans KR, sans-serif"><g transform="translate(110 360)"><rect width="290" height="260" rx="22" fill="#2b2945" stroke="#7c7ddb"/><text x="28" y="56" fill="#bcbcff" font-size="20" font-weight="700">출발점</text><text x="28" y="118" fill="#f5f3ff" font-size="35" font-weight="700">모호한 결과</text><text x="28" y="175" fill="#bdb9ce" font-size="21">원인과 횟수는</text><text x="28" y="207" fill="#bdb9ce" font-size="21">확정하지 않는다</text></g>
<path d="M435 490H520M795 490H880M1155 490H1240" stroke="#9b9bf4" stroke-width="5"/><g fill="#9b9bf4"><path d="M500 473l28 17-28 17"/><path d="M860 473l28 17-28 17"/><path d="M1220 473l28 17-28 17"/></g>
<g transform="translate(545 360)"><rect width="290" height="260" rx="22" fill="#20333a" stroke="#6d9aa7"/><text x="28" y="56" fill="#a8e1ef" font-size="20" font-weight="700">관찰 01</text><text x="28" y="118" fill="#f5f3ff" font-size="35" font-weight="700">기술 경로</text><text x="28" y="175" fill="#bdb9ce" font-size="21">링크·구조·오류를</text><text x="28" y="207" fill="#bdb9ce" font-size="21">별도 점검</text></g>
<g transform="translate(905 360)"><rect width="290" height="260" rx="22" fill="#25352a" stroke="#76a880"/><text x="28" y="56" fill="#b7eba9" font-size="20" font-weight="700">관찰 02</text><text x="28" y="118" fill="#f5f3ff" font-size="35" font-weight="700">발견성·원고</text><text x="28" y="175" fill="#bdb9ce" font-size="21">도달 경로와 제목,</text><text x="28" y="207" fill="#bdb9ce" font-size="21">본문 약속 점검</text></g>
<g transform="translate(1265 360)"><rect width="225" height="260" rx="22" fill="#342b24" stroke="#c89b69"/><text x="26" y="56" fill="#ffd098" font-size="20" font-weight="700">결론</text><text x="26" y="118" fill="#f5f3ff" font-size="35" font-weight="700">인과 유보</text><text x="26" y="175" fill="#bdb9ce" font-size="20">수정과 승인</text><text x="26" y="205" fill="#bdb9ce" font-size="20">사이는 미확정</text></g></g>
<text x="110" y="775" fill="#dcd8ee" font-family="Noto Sans KR, sans-serif" font-size="27">수정은 기록한다. 승인에 기여했다는 결론은 별도 외부 증거가 생길 때까지 남겨 둔다.</text>
</svg>
