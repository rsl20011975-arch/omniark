<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">화면 숨김과 원본 HTML 제거의 차이</title>
  <desc id="desc">템플릿 수정에서 넓은 구조 변경은 빈 화면을 만들 수 있고, CSS 숨김은 원본 HTML의 요소를 제거하지 않음을 보여 준다.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d1623"/><stop offset="1" stop-color="#18263b"/></linearGradient><linearGradient id="safe" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#050308" flood-opacity=".5"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="116" fill="#fffaff" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">화면에서 감춘 것과 원본에서 지운 것은 다르다</text><text x="102" y="164" fill="#d7c8dc" font-family="Pretendard, Arial, sans-serif" font-size="24">템플릿은 구조를 크게 바꾸기보다, 화면·원본 HTML·복구 경로를 함께 확인하며 최소 범위로 수정했다.</text>
  <g filter="url(#s)" font-family="Pretendard, Arial, sans-serif"><rect x="100" y="260" width="420" height="390" rx="30" fill="#4b2938" stroke="#fda4af" stroke-opacity=".72"/><text x="140" y="322" fill="#ffc4cb" font-size="19" font-weight="700">첫 시도 · 넓은 구조 변경</text><text x="140" y="385" fill="#fff7f8" font-size="33" font-weight="700">섹션 삭제·이동</text><rect x="140" y="440" width="340" height="100" rx="16" fill="#653747"/><text x="171" y="482" fill="#ffe3e7" font-size="23" font-weight="600">핵심 위젯이 사라진</text><text x="171" y="514" fill="#ffe3e7" font-size="23" font-weight="600">빈 화면</text><text x="140" y="606" fill="#ffc6cf" font-size="19">즉시 원본으로 복원 · 원인은 미확정</text>
  <rect x="590" y="260" width="420" height="390" rx="30" fill="#463d2b" stroke="#fde68a" stroke-opacity=".7"/><text x="630" y="322" fill="#ffe9a5" font-size="19" font-weight="700">두 번째 · CSS 숨김</text><text x="630" y="385" fill="#fffdf2" font-size="33" font-weight="700">화면에서는 사라짐</text><rect x="630" y="440" width="340" height="100" rx="16" fill="#625339"/><text x="661" y="482" fill="#fff3c9" font-size="23" font-weight="600">원본 HTML에는</text><text x="661" y="514" fill="#fff3c9" font-size="23" font-weight="600">링크가 그대로 남음</text><text x="630" y="606" fill="#ffe5a0" font-size="19">시각적 성공 ≠ 문서 구조 변경</text>
  <rect x="1080" y="260" width="420" height="390" rx="30" fill="#20443f" stroke="#6ee7b7" stroke-opacity=".72"/><text x="1120" y="322" fill="#b7f6d4" font-size="19" font-weight="700">세 번째 · 최소 변경</text><text x="1120" y="385" fill="#f2fff8" font-size="33" font-weight="700">표시 상태만 수정</text><rect x="1120" y="440" width="340" height="100" rx="16" fill="#30645b"/><text x="1151" y="482" fill="#d8fae7" font-size="23" font-weight="600">화면과 원본에서</text><text x="1151" y="514" fill="#d8fae7" font-size="23" font-weight="600">함께 사라짐</text><text x="1120" y="606" fill="#b2f0cf" font-size="19">핵심 구조를 보존한 채 재검증</text></g>
  <path d="M532 454h45M1022 454h45" stroke="url(#safe)" stroke-width="5" stroke-linecap="round"/><path d="M558 436l26 18-26 18M1048 436l26 18-26 18" fill="none" stroke="#d8f4ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="100" y="742" width="1400" height="70" rx="22" fill="#252735" stroke="#7c829c" stroke-opacity=".6"/><text x="140" y="787" fill="#edf4ff" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="600">검수 순서: 복원점 확보 → 화면 확인 → 원본 HTML 확인 → 가장 작은 의미 있는 변경 → 화면과 원본 재확인.</text>
</svg>
