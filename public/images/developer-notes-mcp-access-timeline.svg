<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MCP 접근 시간선</title><desc id="desc">도구 0개 노출, 승인 차단, health 응답을 등록·노출·승인·응답 네 관문으로 분리한 시간선</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1820"/><stop offset="1" stop-color="#15261c"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="20"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1450" cy="90" r="250" fill="#bbff59" opacity=".1" filter="url(#g)"/>
<text x="110" y="124" fill="#caff74" font-family="Noto Sans KR, sans-serif" font-size="22" font-weight="700" letter-spacing="5">MCP ACCESS / OBSERVED STATES</text><text x="110" y="204" fill="#f4f4ef" font-family="Noto Sans KR, sans-serif" font-size="58" font-weight="700">“안 된다”는 하나의 상태가 아니었다</text>
<text x="110" y="252" fill="#abb6b6" font-family="Noto Sans KR, sans-serif" font-size="24">한 날짜에 남은 세 관찰을 해결 원인이 아니라 검증 관문으로 다시 읽었다</text>
<path d="M170 514H1430" stroke="#52636a" stroke-width="4"/><path d="M170 514H1170" stroke="#caff74" stroke-width="4"/>
<g font-family="Noto Sans KR, sans-serif"><g transform="translate(160 332)"><circle cx="100" cy="182" r="18" fill="#ff916c"/><text x="0" y="40" fill="#ffbfac" font-size="23" font-weight="700">13:01 / 세션 노출</text><text x="0" y="92" fill="#f4f4ef" font-size="35" font-weight="700">도구 0개</text><text x="0" y="132" fill="#abb6b6" font-size="21">목록에 없으면</text><text x="0" y="162" fill="#abb6b6" font-size="21">호출도 시작할 수 없다</text></g>
<g transform="translate(570 548)"><circle cx="100" cy="-34" r="18" fill="#ffc56d"/><text x="0" y="40" fill="#ffd59a" font-size="23" font-weight="700">13:23 · 13:36 / 호출 승인</text><text x="0" y="92" fill="#f4f4ef" font-size="35" font-weight="700">보이지만 차단됨</text><text x="0" y="132" fill="#abb6b6" font-size="21">목록 노출과 실행 권한은</text><text x="0" y="162" fill="#abb6b6" font-size="21">서로 다른 확인 항목이다</text></g>
<g transform="translate(1090 332)"><circle cx="100" cy="182" r="18" fill="#caff74"/><text x="0" y="40" fill="#d9ff9e" font-size="23" font-weight="700">14:09 / 실제 응답</text><text x="0" y="92" fill="#f4f4ef" font-size="35" font-weight="700">health 응답</text><text x="0" y="132" fill="#abb6b6" font-size="21">읽기 요청 하나가</text><text x="0" y="162" fill="#abb6b6" font-size="21">끝까지 돌아왔다는 관찰</text></g></g>
<rect x="110" y="760" width="1380" height="70" rx="14" fill="#1c2b25" stroke="#465b4a"/><text x="145" y="805" fill="#dce9d2" font-family="Noto Sans KR, sans-serif" font-size="25">결론: 등록 → 세션 노출 → 호출 승인 → 실제 응답. 네 단계를 따로 확인하면 원인을 섞지 않는다.</text>
</svg>
