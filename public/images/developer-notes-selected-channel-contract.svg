<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">선택한 채널이 실행기까지 전달되는 계약</title><desc id="desc">화면에서 채널을 선택해도 마지막 실행기가 이를 읽지 않으면 모든 활성 채널이 실행될 수 있음을 보여 준다.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c29"/><stop offset="1" stop-color="#2d2445"/></linearGradient><linearGradient id="good" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".5"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="116" fill="#f7fbff" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">드롭다운의 선택은, 마지막 실행기까지 전달돼야 한다</text><text x="102" y="164" fill="#c4d4e7" font-family="Pretendard, Arial, sans-serif" font-size="24">화면·스케줄러·실행기 중 하나라도 입력 계약을 무시하면 한 채널용 예약이 전체 실행이 된다.</text><g filter="url(#s)" font-family="Pretendard, Arial, sans-serif"><rect x="100" y="300" width="370" height="310" rx="30" fill="#23445c" stroke="#7dd3fc" stroke-opacity=".68"/><text x="140" y="360" fill="#bdeaff" font-size="19" font-weight="700">01 · 화면</text><text x="140" y="418" fill="#f3fbff" font-size="31" font-weight="700">채널 하나 선택</text><rect x="140" y="470" width="290" height="62" rx="15" fill="#32647f"/><text x="171" y="510" fill="#d9f4ff" font-size="23">선택값 저장</text><rect x="615" y="300" width="370" height="310" rx="30" fill="#363156" stroke="#c4b5fd" stroke-opacity=".7"/><text x="655" y="360" fill="#dfd6ff" font-size="19" font-weight="700">02 · 스케줄러</text><text x="655" y="418" fill="#fcfbff" font-size="31" font-weight="700">선택값 전달</text><rect x="655" y="470" width="290" height="62" rx="15" fill="#4b4373"/><text x="686" y="510" fill="#ece9ff" font-size="23">명령의 인자</text><rect x="1130" y="300" width="370" height="310" rx="30" fill="#294841" stroke="#6ee7b7" stroke-opacity=".7"/><text x="1170" y="360" fill="#baf3d2" font-size="19" font-weight="700">03 · 실행기</text><text x="1170" y="418" fill="#f2fff7" font-size="31" font-weight="700">값을 읽고 제한</text><rect x="1170" y="470" width="290" height="62" rx="15" fill="#37685b"/><text x="1201" y="510" fill="#d9fce7" font-size="23">한 채널만 실행</text></g><g stroke="url(#good)" stroke-width="5" fill="none" stroke-linecap="round"><path d="M482 456h100"/><path d="M997 456h100"/></g><g fill="#dceaff"><path d="M556 437l27 19-27 19z"/><path d="M1071 437l27 19-27 19z"/></g><rect x="100" y="724" width="1400" height="74" rx="22" fill="#202b39" stroke="#6d849f" stroke-opacity=".62"/><text x="140" y="772" fill="#e7f3ff" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="600">안전 규칙: 선택값이 없을 때의 기본 동작을 명시하고, 알 수 없는 값은 조용히 전체 실행으로 떨어뜨리지 말고 실패시킨다.</text></svg>
