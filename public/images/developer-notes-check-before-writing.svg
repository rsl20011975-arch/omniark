<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">생성 전에 발행 가능 여부를 확인하는 가드</title><desc id="desc">글을 만든 뒤 발행 직전에 막는 흐름과, 공개 이력을 먼저 확인해 불필요한 생성을 건너뛰는 흐름을 비교한다.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19201b"/><stop offset="1" stop-color="#203638"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020805" flood-opacity=".52"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="116" fill="#f7fff9" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">발행 가드는 글을 쓴 뒤가 아니라, 쓰기 전에 물어야 한다</text><text x="102" y="164" fill="#c9dbcd" font-family="Pretendard, Arial, sans-serif" font-size="24">정책상 공개할 수 없는 날에는 콘텐츠를 만들지 않는 것이 비용과 거짓 실패를 함께 막는다.</text><g filter="url(#s)" font-family="Pretendard, Arial, sans-serif"><rect x="100" y="276" width="620" height="390" rx="30" fill="#4d3430" stroke="#fda4af" stroke-opacity=".7"/><text x="140" y="338" fill="#ffcbd0" font-size="19" font-weight="700">이전 순서</text><text x="140" y="400" fill="#fff7f7" font-size="32" font-weight="700">선택 → 글쓰기 → 발행 직전 차단</text><path d="M154 477h450" stroke="#f5c4b7" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 12"/><text x="140" y="555" fill="#f0d0ca" font-size="21">생성 시간·호출 비용은 이미 사용</text><text x="140" y="594" fill="#ffb4c0" font-size="20" font-weight="600">정상 정책도 ‘실패’처럼 보일 수 있음</text><rect x="880" y="276" width="620" height="390" rx="30" fill="#24463b" stroke="#6ee7b7" stroke-opacity=".72"/><text x="920" y="338" fill="#bef7d4" font-size="19" font-weight="700">바꾼 순서</text><text x="920" y="400" fill="#f4fff7" font-size="32" font-weight="700">공개 이력 확인 → 선택 → 글쓰기</text><rect x="920" y="458" width="520" height="78" rx="16" fill="#326454"/><text x="950" y="507" fill="#d9fce6" font-size="23" font-weight="600">기준에 닿음: 새 작업 없이 건너뜀</text><text x="920" y="594" fill="#aaf1c8" font-size="20" font-weight="600">정책상 대기는 정상 종료로 기록</text></g><path d="M743 474h100" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/><path d="M816 455l27 19-27 19" fill="none" stroke="#e4ffe9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="744" width="1400" height="68" rx="22" fill="#203128" stroke="#648173" stroke-opacity=".62"/><text x="140" y="789" fill="#edfff1" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="600">가드는 모든 실행을 무조건 막지 않는다. 공개 발행·초안·의도적 수동 실행을 먼저 구분하고, 공개 이력에만 정책을 적용한다.</text></svg>
