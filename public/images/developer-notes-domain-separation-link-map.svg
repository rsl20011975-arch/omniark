<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">도메인 분리 뒤 링크와 크롤링 점검</title><desc id="desc">독립 블로그 전환 후 첫 화면 링크, 내부 경로, 정규 주소, 외부 크롤링 시간을 분리해 점검하는 구조를 보여 준다.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132132"/><stop offset="1" stop-color="#29283f"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".5"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="116" fill="#f5f8ff" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">도메인을 분리한 뒤, 주소 하나가 아니라 경로 전체를 고쳤다</text><text x="102" y="164" fill="#c6d2e6" font-family="Pretendard, Arial, sans-serif" font-size="24">사이트 내부의 수리와 검색 엔진의 크롤링 시간은 다른 문제다. 같은 화면에서 한꺼번에 판단하지 않는다.</text><g filter="url(#s)" font-family="Pretendard, Arial, sans-serif"><rect x="100" y="288" width="340" height="330" rx="30" fill="#2b4a62" stroke="#7dd3fc" stroke-opacity=".7"/><text x="140" y="350" fill="#c0edff" font-size="19" font-weight="700">01 · 첫 화면</text><text x="140" y="409" fill="#f4fbff" font-size="30" font-weight="700">죽은 링크 제거</text><text x="140" y="462" fill="#c9deeb" font-size="20">메뉴 · 로고 · 분류</text><text x="140" y="494" fill="#c9deeb" font-size="20">방문자가 밟는 경로</text><rect x="510" y="288" width="340" height="330" rx="30" fill="#34325c" stroke="#c4b5fd" stroke-opacity=".7"/><text x="550" y="350" fill="#ded7ff" font-size="19" font-weight="700">02 · 문서 구조</text><text x="550" y="409" fill="#fbfaff" font-size="30" font-weight="700">정규 주소 일치</text><text x="550" y="462" fill="#d9d5e9" font-size="20">글 · 페이지 · 홈</text><text x="550" y="494" fill="#d9d5e9" font-size="20">신뢰 페이지 · 사이트맵</text><rect x="920" y="288" width="340" height="330" rx="30" fill="#33433c" stroke="#86efac" stroke-opacity=".7"/><text x="960" y="350" fill="#bcf5d1" font-size="19" font-weight="700">03 · 내부 경로</text><text x="960" y="409" fill="#f4fff7" font-size="30" font-weight="700">기존 사이트의 링크</text><text x="960" y="462" fill="#cde4d4" font-size="20">이미 방문되는 곳에서</text><text x="960" y="494" fill="#cde4d4" font-size="20">새 블로그로 가는 다리</text><rect x="1330" y="288" width="170" height="330" rx="30" fill="#44363f" stroke="#f0abfc" stroke-opacity=".7"/><text x="1356" y="350" fill="#f7cffd" font-size="19" font-weight="700">04</text><text x="1356" y="409" fill="#fff8ff" font-size="28" font-weight="700">크롤링</text><text x="1356" y="462" fill="#e7d6e8" font-size="18">언제</text><text x="1356" y="489" fill="#e7d6e8" font-size="18">방문할지는</text><text x="1356" y="516" fill="#e7d6e8" font-size="18">외부 시간표</text></g><g stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round"><path d="M452 453h45"/><path d="M862 453h45"/><path d="M1272 453h45"/></g><g fill="#e4edff"><path d="M477 434l22 19-22 19z"/><path d="M887 434l22 19-22 19z"/><path d="M1297 434l22 19-22 19z"/></g><rect x="100" y="744" width="1400" height="70" rx="22" fill="#202a3a" stroke="#6e819f" stroke-opacity=".65"/><text x="140" y="789" fill="#ecf4ff" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="600">완료 기준을 나눈다: 링크·정규 주소·신뢰 페이지는 우리가 확인한다. 색인과 심사 결과는 외부 관찰값으로 나중에 기록한다.</text></svg>
