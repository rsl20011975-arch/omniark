<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="720" viewBox="0 0 1260 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">바이브 코딩을 시작하기 전 확인할 세 가지 질문</title>
  <desc id="desc">목적, 사용 흐름, 완료 조건이라는 세 장의 카드와 AI에게 맡길 질문이 함께 표시되어 있다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1260" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#111528"/><stop offset=".52" stop-color="#0B1020"/><stop offset="1" stop-color="#151226"/></linearGradient>
    <linearGradient id="card1" x1="80" y1="168" x2="710" y2="286" gradientUnits="userSpaceOnUse"><stop stop-color="#183D47"/><stop offset="1" stop-color="#15304A"/></linearGradient>
    <linearGradient id="card2" x1="80" y1="314" x2="710" y2="432" gradientUnits="userSpaceOnUse"><stop stop-color="#28224E"/><stop offset="1" stop-color="#20385C"/></linearGradient>
    <linearGradient id="card3" x1="80" y1="460" x2="710" y2="578" gradientUnits="userSpaceOnUse"><stop stop-color="#4A2A26"/><stop offset="1" stop-color="#453249"/></linearGradient>
    <filter id="shadow" x="-30%" y="-35%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#010208" flood-opacity=".48"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#CFD9FF" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1260" height="720" rx="26" fill="url(#bg)"/><rect width="1260" height="720" rx="26" fill="url(#grid)"/>
  <circle cx="1124" cy="142" r="190" fill="#764BC5" fill-opacity=".13"/><circle cx="119" cy="666" r="160" fill="#11999A" fill-opacity=".1"/>
  <text x="74" y="82" fill="#AEB8D5" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">STARTING A BUILD / 3 QUESTIONS</text>
  <text x="74" y="126" fill="#F5F8FF" font-family="Pretendard, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-1.3">모르는 구조는 AI에게 찾게 하되, 이 세 가지는 먼저 말합니다</text>
  <g filter="url(#shadow)">
    <rect x="74" y="163" width="656" height="116" rx="22" fill="url(#card1)" stroke="#6DE0D7" stroke-opacity=".42"/>
    <circle cx="119" cy="221" r="23" fill="#123E47" stroke="#62E2D7" stroke-width="2"/><text x="112" y="228" fill="#C4FFF9" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="800">1</text>
    <text x="163" y="208" fill="#A2F6ED" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5">목적</text><text x="163" y="246" fill="#F2FFFE" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="800">이 프로그램으로 결국 무엇을 얻고 싶은가?</text>
    <rect x="74" y="309" width="656" height="116" rx="22" fill="url(#card2)" stroke="#9D9BFF" stroke-opacity=".42"/>
    <circle cx="119" cy="367" r="23" fill="#2D285D" stroke="#A7A6FF" stroke-width="2"/><text x="112" y="374" fill="#ECEBFF" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="800">2</text>
    <text x="163" y="354" fill="#D2D2FF" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5">사용 흐름</text><text x="163" y="392" fill="#F7F6FF" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="800">실제로 쓸 때, 사람은 어떤 일을 순서대로 하는가?</text>
    <rect x="74" y="455" width="656" height="116" rx="22" fill="url(#card3)" stroke="#FFA56E" stroke-opacity=".45"/>
    <circle cx="119" cy="513" r="23" fill="#5B302D" stroke="#FFB579" stroke-width="2"/><text x="112" y="520" fill="#FFE9D7" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="800">3</text>
    <text x="163" y="500" fill="#FFD1AF" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5">완료 조건</text><text x="163" y="538" fill="#FFF7F1" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="800">무엇을 확인해야 “완성”이라고 말할 수 있는가?</text>
  </g>
  <g filter="url(#shadow)"><rect x="778" y="172" width="408" height="398" rx="24" fill="#171C33" stroke="#C18CFF" stroke-opacity=".42"/><rect x="809" y="204" width="146" height="34" rx="17" fill="#3B245C"/><text x="829" y="227" fill="#E9CDFF" font-family="Pretendard, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1">AI에게 맡길 일</text><text x="809" y="281" fill="#F9F3FF" font-family="Pretendard, Arial, sans-serif" font-size="25" font-weight="800">모르는 것을 찾아 달라고</text><text x="809" y="314" fill="#F9F3FF" font-family="Pretendard, Arial, sans-serif" font-size="25" font-weight="800">질문합니다</text><path d="M809 347H1151" stroke="#7E669F" stroke-opacity=".55"/><circle cx="824" cy="383" r="5" fill="#72E4D9"/><text x="844" y="389" fill="#C6D2EA" font-family="Pretendard, Arial, sans-serif" font-size="16">빠진 필수 기능은 무엇인가?</text><circle cx="824" cy="425" r="5" fill="#A89FFF"/><text x="844" y="431" fill="#C6D2EA" font-family="Pretendard, Arial, sans-serif" font-size="16">무엇부터 만들면 되는가?</text><circle cx="824" cy="467" r="5" fill="#FFB779"/><text x="844" y="473" fill="#C6D2EA" font-family="Pretendard, Arial, sans-serif" font-size="16">결과를 어떻게 확인할 것인가?</text><rect x="809" y="504" width="342" height="39" rx="12" fill="#222A47"/><text x="828" y="530" fill="#ACBBDA" font-family="Pretendard, Arial, sans-serif" font-size="14" font-weight="700">코드는 설계가 납득된 뒤에 시작합니다.</text></g>
  <text x="74" y="660" fill="#8998B7" font-family="Pretendard, Arial, sans-serif" font-size="16">완벽한 명령을 쓰는 것이 목표가 아닙니다. 다음 질문을 더 잘하기 위한 출발점을 만드는 일입니다.</text>
</svg>
