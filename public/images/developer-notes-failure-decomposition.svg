<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">하나의 전부 실패 알림을 다섯 원인으로 분해한 지도</title>
  <desc id="desc">통합 실패 알림 하나가 실행 환경, 한도 분류, 물량 변화, 플랫폼 한도, 인증 설정의 다섯 범주로 나뉘는 도식이다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171018"/><stop offset="1" stop-color="#351d20"/></linearGradient>
    <linearGradient id="signal" x1="0" x2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#080408" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><path d="M0 720C260 590 486 850 740 724s398-105 860-27v203H0z" fill="#f97316" opacity=".06"/>
  <text x="100" y="116" fill="#fff7ed" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">“전부 실패”는 원인이 아니라, 압축된 경보다</text>
  <text x="102" y="164" fill="#e4c9c5" font-family="Pretendard, Arial, sans-serif" font-size="24">하나의 빨간 알림을 작업·산출물·원인 단위로 다시 풀면, 서로 다른 수리가 보인다.</text>
  <g filter="url(#s)"><rect x="588" y="250" width="424" height="150" rx="30" fill="#4b2630" stroke="#fb7185" stroke-width="2"/><rect x="628" y="284" width="124" height="36" rx="18" fill="url(#signal)"/><text x="659" y="309" fill="#3e161c" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="700">통합 알림</text><text x="628" y="365" fill="#fff7f6" font-family="Pretendard, Arial, sans-serif" font-size="33" font-weight="700">한 채널 실패 → 전체 실패</text></g>
  <g stroke="#e8b6ad" stroke-width="3" fill="none" opacity=".9"><path d="M680 412L288 506"/><path d="M762 412L594 506"/><path d="M800 412v94"/><path d="M840 412l168 94"/><path d="M922 412l390 94"/></g>
  <g filter="url(#s)" font-family="Pretendard, Arial, sans-serif">
    <g><rect x="100" y="520" width="300" height="210" rx="25" fill="#2c3c53" stroke="#7dd3fc" stroke-opacity=".65"/><text x="132" y="575" fill="#a9e5ff" font-size="18" font-weight="700">01 · 실행 환경</text><text x="132" y="620" fill="#f3fbff" font-size="27" font-weight="700">런타임이 없음</text><text x="132" y="661" fill="#c9dbe8" font-size="18">재시도보다 먼저</text><text x="132" y="688" fill="#c9dbe8" font-size="18">실행 가능 여부를 확인</text></g>
    <g><rect x="420" y="520" width="300" height="210" rx="25" fill="#40334c" stroke="#c4b5fd" stroke-opacity=".7"/><text x="452" y="575" fill="#d9d1ff" font-size="18" font-weight="700">02 · 한도 분류</text><text x="452" y="620" fill="#fbf8ff" font-size="27" font-weight="700">소진 ≠ 속도 제한</text><text x="452" y="661" fill="#d9d1e8" font-size="18">같은 상태 코드도</text><text x="452" y="688" fill="#d9d1e8" font-size="18">다른 행동을 요구</text></g>
    <g><rect x="740" y="520" width="300" height="210" rx="25" fill="#454023" stroke="#fde68a" stroke-opacity=".72"/><text x="772" y="575" fill="#fff0a8" font-size="18" font-weight="700">03 · 물량 변화</text><text x="772" y="620" fill="#fffcf0" font-size="27" font-weight="700">의도 확인 필요</text><text x="772" y="661" fill="#e9dfba" font-size="18">장애가 아니어도</text><text x="772" y="688" fill="#e9dfba" font-size="18">실패를 증폭할 수 있음</text></g>
    <g><rect x="1060" y="520" width="300" height="210" rx="25" fill="#24463d" stroke="#86efac" stroke-opacity=".72"/><text x="1092" y="575" fill="#b4f4c8" font-size="18" font-weight="700">04 · 외부 플랫폼</text><text x="1092" y="620" fill="#f2fff5" font-size="27" font-weight="700">작성 한도</text><text x="1092" y="661" fill="#c9e4d0" font-size="18">화면의 안내를</text><text x="1092" y="688" fill="#c9e4d0" font-size="18">API 오류로 추측하지 않기</text></g>
    <g><rect x="1380" y="520" width="150" height="210" rx="25" fill="#4f3035" stroke="#fda4af" stroke-opacity=".75"/><text x="1403" y="575" fill="#ffd0d5" font-size="18" font-weight="700">05</text><text x="1403" y="620" fill="#fff4f5" font-size="25" font-weight="700">인증</text><text x="1403" y="656" fill="#f3cbd0" font-size="17">만료가</text><text x="1403" y="681" fill="#f3cbd0" font-size="17">아닌</text><text x="1403" y="706" fill="#f3cbd0" font-size="17">설정 중복</text></g>
  </g>
  <rect x="100" y="794" width="1430" height="66" rx="20" fill="#2f2026" stroke="#885864" stroke-opacity=".7"/>
  <text x="136" y="837" fill="#ffe9e5" font-family="Pretendard, Arial, sans-serif" font-size="23" font-weight="600">좋은 실패 알림은 “실패”에서 끝나지 않는다. 성공·실패·미실행 작업, 단계, 재시도 가능성, 사람의 판단 필요 여부까지 남긴다.</text>
</svg>
