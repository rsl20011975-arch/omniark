<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">자동완성 제안 하나와 실제 수요의 차이</title><desc id="desc">단어 하나에서 제안 하나를 찾는 느슨한 게이트와, 학습자의 질문 단위로 맥락을 확인하는 측정을 대비한다.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e1722"/><stop offset="1" stop-color="#20373a"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#060408" flood-opacity=".52"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="116" fill="#fff9fb" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">제안 하나는 수요의 증거가 되기엔 너무 약하다</text><text x="102" y="164" fill="#dfcbd2" font-family="Pretendard, Arial, sans-serif" font-size="24">측정의 단위를 단어에서 실제 학습자 질문으로 바꾸자, 통과율이 아니라 문제의 모양이 달라졌다.</text><g filter="url(#s)" font-family="Pretendard, Arial, sans-serif"><rect x="100" y="286" width="610" height="370" rx="30" fill="#4a2d38" stroke="#fda4af" stroke-opacity=".7"/><text x="140" y="346" fill="#ffc9d1" font-size="19" font-weight="700">이전 · 단어 하나</text><text x="140" y="409" fill="#fff7f8" font-size="32" font-weight="700">제안 하나면 통과</text><rect x="140" y="464" width="530" height="64" rx="15" fill="#673d4c"/><text x="170" y="505" fill="#ffe2e7" font-size="22">동음이의 · 기계적 보완 · 맥락 누락</text><text x="140" y="589" fill="#ffc6cf" font-size="20">결과: 거의 모든 후보가 통과</text><rect x="890" y="286" width="610" height="370" rx="30" fill="#24483d" stroke="#6ee7b7" stroke-opacity=".72"/><text x="930" y="346" fill="#bff8d6" font-size="19" font-weight="700">변경 · 학습자 질문</text><text x="930" y="409" fill="#f4fff7" font-size="32" font-weight="700">문맥과 신호를 함께 측정</text><rect x="930" y="464" width="530" height="64" rx="15" fill="#336655"/><text x="960" y="505" fill="#ddfce9" font-size="22">여러 표현 · 의미 확인 · 질문 묶음</text><text x="930" y="589" fill="#b0f0ca" font-size="20">결과: 글감 단위가 ‘답할 질문’으로 바뀜</text></g><path d="M742 471h106" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/><path d="M821 452l28 19-28 19" fill="none" stroke="#e8ffe9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="744" width="1400" height="70" rx="22" fill="#26302e" stroke="#768b84" stroke-opacity=".65"/><text x="140" y="789" fill="#f0fff5" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="600">경계: 수요 후보를 더 잘 고르는 일과, 그 질문에 사실·표현·구성으로 잘 답하는 일은 별도의 관문이다.</text></svg>
