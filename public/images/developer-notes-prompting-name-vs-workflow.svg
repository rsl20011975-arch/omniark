<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="720" viewBox="0 0 1260 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">기능 이름만 말하는 요청과 실제 사용 흐름을 설명하는 요청의 차이</title>
  <desc id="desc">왼쪽에는 모호한 대시보드라는 이름만 있고, 오른쪽에는 확인, 열어 보기, 고치기, 다시 실행의 실제 사용 흐름이 있다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1260" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#111326"/><stop offset=".52" stop-color="#0B1020"/><stop offset="1" stop-color="#10162A"/></linearGradient>
    <linearGradient id="left" x1="95" y1="150" x2="500" y2="590" gradientUnits="userSpaceOnUse"><stop stop-color="#212742"/><stop offset="1" stop-color="#151A31"/></linearGradient>
    <linearGradient id="right" x1="690" y1="150" x2="1170" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#152B3B"/><stop offset=".52" stop-color="#151B39"/><stop offset="1" stop-color="#2C1641"/></linearGradient>
    <linearGradient id="line" x1="688" y1="362" x2="1138" y2="362" gradientUnits="userSpaceOnUse"><stop stop-color="#57E0D5"/><stop offset=".55" stop-color="#7BA9FF"/><stop offset="1" stop-color="#E795FA"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#02030A" flood-opacity=".45"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#C6D7FF" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1260" height="720" rx="26" fill="url(#bg)"/>
  <rect width="1260" height="720" rx="26" fill="url(#grid)"/>
  <circle cx="1058" cy="83" r="220" fill="#5B39B8" fill-opacity=".13" filter="url(#glow)"/>
  <circle cx="124" cy="666" r="195" fill="#128A8D" fill-opacity=".1" filter="url(#glow)"/>
  <text x="74" y="82" fill="#AEB8D5" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">VIBE CODING NOTE / 01</text>
  <text x="74" y="126" fill="#F4F7FF" font-family="Pretendard, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-1.4">기능 이름과 사용 장면은 다릅니다</text>
  <g filter="url(#shadow)">
    <rect x="72" y="162" width="454" height="470" rx="24" fill="url(#left)" stroke="#8999C9" stroke-opacity=".28"/>
    <rect x="103" y="197" width="118" height="34" rx="17" fill="#393F62"/>
    <text x="122" y="220" fill="#C9D0E8" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.3">이름만 말함</text>
    <text x="103" y="282" fill="#F4F7FF" font-family="Pretendard, Arial, sans-serif" font-size="32" font-weight="800">“대시보드가 필요해요”</text>
    <text x="103" y="319" fill="#98A2C4" font-family="Pretendard, Arial, sans-serif" font-size="18">무엇을 해야 하는지는 아직 비어 있습니다.</text>
    <rect x="103" y="361" width="178" height="92" rx="16" fill="#292F4A" stroke="#8999C9" stroke-opacity=".25"/>
    <text x="126" y="399" fill="#DDE5FA" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="700">상태 숫자</text><text x="126" y="427" fill="#7F8AAC" font-family="Pretendard, Arial, sans-serif" font-size="15">작업 12개</text>
    <rect x="301" y="361" width="178" height="92" rx="16" fill="#292F4A" stroke="#8999C9" stroke-opacity=".25"/>
    <text x="324" y="399" fill="#DDE5FA" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="700">상태 그래프</text><text x="324" y="427" fill="#7F8AAC" font-family="Pretendard, Arial, sans-serif" font-size="15">연결됨</text>
    <rect x="103" y="472" width="376" height="112" rx="16" fill="#202640" stroke="#8999C9" stroke-opacity=".2"/>
    <text x="126" y="512" fill="#AAB4D1" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="700">AI가 무난하게 채우기 쉬운 화면</text>
    <text x="126" y="544" fill="#7884A7" font-family="Pretendard, Arial, sans-serif" font-size="16">“무엇을 보여줄까?”에 머물기 쉽습니다.</text>
  </g>
  <path d="M558 396C583 396 588 324 616 324H649" stroke="#6D799D" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 11"/>
  <circle cx="570" cy="396" r="7" fill="#7C89AF"/><path d="M638 309L662 324L638 339" stroke="#7C89AF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="685" y="162" width="502" height="470" rx="24" fill="url(#right)" stroke="#8AF2E7" stroke-opacity=".38"/>
    <rect x="716" y="197" width="146" height="34" rx="17" fill="#173F4A" stroke="#62E5D8" stroke-opacity=".45"/>
    <text x="736" y="220" fill="#91F7EA" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.1">장면을 말함</text>
    <text x="716" y="282" fill="#F4F7FF" font-family="Pretendard, Arial, sans-serif" font-size="29" font-weight="800">“여기서 내가 할 일을 설명해요”</text>
    <text x="716" y="319" fill="#B3C0DD" font-family="Pretendard, Arial, sans-serif" font-size="18">화면이 아니라, 사용자가 거치는 일을 먼저 꺼냅니다.</text>
    <path d="M761 404H1122" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
    <g font-family="Pretendard, Arial, sans-serif"><circle cx="770" cy="404" r="18" fill="#123F48" stroke="#57E0D5" stroke-width="2"/><text x="764" y="410" fill="#C8FFFA" font-size="15" font-weight="800">1</text><text x="733" y="456" fill="#E7FBF9" font-size="18" font-weight="800">확인</text><text x="714" y="482" fill="#91A5C3" font-size="14">제작 중인 결과</text><circle cx="889" cy="404" r="18" fill="#192E55" stroke="#7BA9FF" stroke-width="2"/><text x="883" y="410" fill="#DCE8FF" font-size="15" font-weight="800">2</text><text x="843" y="456" fill="#EDF3FF" font-size="18" font-weight="800">열어 보기</text><text x="834" y="482" fill="#91A5C3" font-size="14">글·영상을 검토</text><circle cx="1008" cy="404" r="18" fill="#352459" stroke="#C993FF" stroke-width="2"/><text x="1002" y="410" fill="#F1DBFF" font-size="15" font-weight="800">3</text><text x="981" y="456" fill="#FAEFFF" font-size="18" font-weight="800">고치기</text><text x="958" y="482" fill="#B6A5CE" font-size="14">원하는 부분 수정</text><circle cx="1127" cy="404" r="18" fill="#563843" stroke="#FFB769" stroke-width="2"/><text x="1121" y="410" fill="#FFEAD3" font-size="15" font-weight="800">4</text><text x="1080" y="456" fill="#FFF3E7" font-size="18" font-weight="800">다시 실행</text><text x="1072" y="482" fill="#C8AA98" font-size="14">필요한 단계만</text></g>
    <rect x="716" y="528" width="440" height="61" rx="14" fill="#111B31" stroke="#8AF2E7" stroke-opacity=".18"/>
    <text x="742" y="565" fill="#DDEBFF" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="700">“무엇을 보여줄까?”가 아니라 “무엇을 할까?”</text>
  </g>
  <text x="74" y="680" fill="#8290B2" font-family="Pretendard, Arial, sans-serif" font-size="15">기능의 이름을 붙이는 일은 시작점이고, 실제 사용 흐름은 요구사항의 본문입니다.</text>
</svg>
