<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">제목 생성에서 승인 문구의 정확한 적용까지</title>
  <desc id="desc">생성, 형식 검증, 계획 고정, 사람 검토, 승인된 문자열의 재생성 없는 적용 순서를 보여 준다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".52"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1380" cy="126" r="250" fill="#0ea5e9" opacity=".1"/><circle cx="170" cy="770" r="240" fill="#34d399" opacity=".09"/>
  <text x="100" y="118" fill="#f8fafc" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">검토한 제목과 적용한 제목을 같게 만드는 법</text>
  <text x="102" y="166" fill="#b8c7d9" font-family="Pretendard, Arial, sans-serif" font-size="24">중요한 것은 더 많이 생성하는 일이 아니라, 승인 뒤에 다시 주사위를 굴리지 않는 일이다.</text>
  <g font-family="Pretendard, Arial, sans-serif" filter="url(#s)">
    <g><rect x="100" y="318" width="250" height="286" rx="28" fill="#223149" stroke="#65c8ee" stroke-opacity=".62"/><text x="132" y="375" fill="#99e1ff" font-size="18" font-weight="700">01 · 생성</text><text x="132" y="425" fill="#f7fbff" font-size="29" font-weight="700">후보 만들기</text><text x="132" y="474" fill="#c9d8e7" font-size="19">초안 메모·깨진 기호도</text><text x="132" y="503" fill="#c9d8e7" font-size="19">함께 나올 수 있다</text></g>
    <g><rect x="395" y="318" width="250" height="286" rx="28" fill="#253c4d" stroke="#67e8d0" stroke-opacity=".62"/><text x="427" y="375" fill="#9cf7e7" font-size="18" font-weight="700">02 · 검증</text><text x="427" y="425" fill="#f4fffc" font-size="29" font-weight="700">형식 문지기</text><text x="427" y="474" fill="#cbe6e0" font-size="19">길이 · 기호 · 메타 문구</text><text x="427" y="503" fill="#cbe6e0" font-size="19">정해진 횟수만 재시도</text></g>
    <g><rect x="690" y="318" width="250" height="286" rx="28" fill="#363653" stroke="#c4b5fd" stroke-opacity=".68"/><text x="722" y="375" fill="#ded7ff" font-size="18" font-weight="700">03 · 고정</text><text x="722" y="425" fill="#fbfaff" font-size="29" font-weight="700">계획 파일</text><text x="722" y="474" fill="#dad6ea" font-size="19">기존값과 후보를</text><text x="722" y="503" fill="#dad6ea" font-size="19">검토 가능한 상태로 보관</text></g>
    <g><rect x="985" y="318" width="250" height="286" rx="28" fill="#4a364a" stroke="#f0abfc" stroke-opacity=".68"/><text x="1017" y="375" fill="#f8c7ff" font-size="18" font-weight="700">04 · 검토</text><text x="1017" y="425" fill="#fff8ff" font-size="29" font-weight="700">사람의 승인</text><text x="1017" y="474" fill="#ead6e9" font-size="19">의미와 맥락은</text><text x="1017" y="503" fill="#ead6e9" font-size="19">형식 검증기가 대신 못 함</text></g>
    <g><rect x="1280" y="318" width="220" height="286" rx="28" fill="#294540" stroke="#86efac" stroke-opacity=".68"/><text x="1312" y="375" fill="#bdfbd0" font-size="18" font-weight="700">05 · 적용</text><text x="1312" y="425" fill="#f5fff7" font-size="29" font-weight="700">그대로</text><text x="1312" y="474" fill="#cce8d3" font-size="19">다시 생성하지 않음</text><text x="1312" y="503" fill="#cce8d3" font-size="19">검토 문자열을 정확히 반영</text></g>
  </g>
  <g stroke="#dcecff" stroke-width="4" fill="none" stroke-linecap="round"><path d="M362 461h20"/><path d="M657 461h20"/><path d="M952 461h20"/><path d="M1247 461h20"/></g>
  <g fill="#dcecff"><path d="M377 450l14 11-14 11z"/><path d="M672 450l14 11-14 11z"/><path d="M967 450l14 11-14 11z"/><path d="M1262 450l14 11-14 11z"/></g>
  <rect x="100" y="706" width="1400" height="86" rx="23" fill="#182536" stroke="#597795" stroke-opacity=".65"/>
  <text x="140" y="760" fill="#d9edff" font-family="Pretendard, Arial, sans-serif" font-size="25" font-weight="600">형식 검증은 품질의 대체물이 아니다. 다만 검토되지 않은 초안 메모가 공개되는 실패를, 적용 전에 멈추게 한다.</text>
</svg>
