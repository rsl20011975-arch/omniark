<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">백업과 발행 직전 중복 가드의 관계</title>
  <desc id="desc">작업 장부 백업, 현재 라이브 사실, 발행 직전 보류 가드가 함께 중복 발행을 방지하는 구조를 보여 준다.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17211b"/><stop offset="1" stop-color="#24342d"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020703" flood-opacity=".52"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="116" fill="#f7fff8" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">중복 방어는 ‘팩 생성’이 아니라 ‘발행 직전’에도 필요하다</text><text x="102" y="164" fill="#c6d8ca" font-family="Pretendard, Arial, sans-serif" font-size="24">기록을 잃으면 판단 근거도 사라진다. 백업·라이브 대조·발행 보류가 세 겹으로 이어져야 한다.</text>
  <g filter="url(#s)" font-family="Pretendard, Arial, sans-serif"><rect x="100" y="286" width="360" height="330" rx="30" fill="#3c3b24" stroke="#fde68a" stroke-opacity=".7"/><text x="140" y="350" fill="#fff0aa" font-size="19" font-weight="700">01 · 장부와 백업</text><text x="140" y="410" fill="#fffdf1" font-size="31" font-weight="700">무엇을 했는가</text><text x="140" y="463" fill="#e8e1bb" font-size="20">작업 이력 · 백업 · 복구 시험</text><text x="140" y="530" fill="#ffdf7e" font-size="19" font-weight="600">기록이 없으면 원인도 못 복원</text>
  <rect x="620" y="286" width="360" height="330" rx="30" fill="#25453c" stroke="#86efac" stroke-opacity=".7"/><text x="660" y="350" fill="#bdf5d1" font-size="19" font-weight="700">02 · 라이브 사실</text><text x="660" y="410" fill="#f4fff7" font-size="31" font-weight="700">이미 무엇이 있는가</text><text x="660" y="463" fill="#c8e7d1" font-size="20">공개 제목 · 주제 · 주소</text><text x="660" y="530" fill="#a6ebc2" font-size="19" font-weight="600">장부가 비어도 실제 공개값은 남음</text>
  <rect x="1140" y="286" width="360" height="330" rx="30" fill="#27445a" stroke="#7dd3fc" stroke-opacity=".72"/><text x="1180" y="350" fill="#bceaff" font-size="19" font-weight="700">03 · 발행 직전 가드</text><text x="1180" y="410" fill="#f2fbff" font-size="31" font-weight="700">충돌하면 보류</text><text x="1180" y="463" fill="#c7dfec" font-size="20">자동 삭제가 아닌 사람의 판단</text><text x="1180" y="530" fill="#a8dff8" font-size="19" font-weight="600">의도적 연재와 중복을 구분</text></g>
  <g stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round"><path d="M475 451h106"/><path d="M995 451h106"/></g><g fill="#dbf5d7"><path d="M554 432l28 19-28 19z"/><path d="M1074 432l28 19-28 19z"/></g>
  <rect x="100" y="730" width="1400" height="74" rx="22" fill="#203128" stroke="#6b8a74" stroke-opacity=".62"/><text x="140" y="778" fill="#ecfff0" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="600">원칙: 위험한 기존 팩은 먼저 보류한다. 삭제·병합은 증거와 복구 계획이 있을 때만 사람이 결정한다.</text>
</svg>
