<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">채널 설명이 주제 채굴의 입력이 되는 구조</title><desc id="desc">독자 소개문에 남은 과거 전략 단어가 자동화의 씨앗으로 쓰여, 채굴과 선별이 서로 충돌하는 과정을 보여 준다.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b2e"/><stop offset="1" stop-color="#26351f"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#030509" flood-opacity=".52"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="116" fill="#f8fbff" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">소개 문장이 자동화의 입력이 되는 순간</text><text x="102" y="164" fill="#c6d1da" font-family="Pretendard, Arial, sans-serif" font-size="24">사람에게는 채널 소개, 시스템에게는 주제 씨앗일 수 있다. 전략이 바뀌면 문장도 함께 갱신돼야 한다.</text><g filter="url(#s)" font-family="Pretendard, Arial, sans-serif"><rect x="100" y="288" width="350" height="340" rx="30" fill="#4b3431" stroke="#fda4af" stroke-opacity=".7"/><text x="140" y="350" fill="#ffc8cf" font-size="19" font-weight="700">과거 설명문</text><text x="140" y="413" fill="#fff7f7" font-size="31" font-weight="700">옛 전략 단어</text><text x="140" y="464" fill="#f0d0ca" font-size="20">독자에게는 보이지 않는</text><text x="140" y="494" fill="#f0d0ca" font-size="20">자동화 입력 오염</text><rect x="625" y="288" width="350" height="340" rx="30" fill="#493e25" stroke="#fde68a" stroke-opacity=".7"/><text x="665" y="350" fill="#fff0a7" font-size="19" font-weight="700">채굴기는 정상</text><text x="665" y="413" fill="#fffdf1" font-size="31" font-weight="700">후보를 많이 수집</text><text x="665" y="464" fill="#eae1ba" font-size="20">입력 단어 주변을</text><text x="665" y="494" fill="#eae1ba" font-size="20">성실하게 확장</text><rect x="1150" y="288" width="350" height="340" rx="30" fill="#2f4538" stroke="#86efac" stroke-opacity=".7"/><text x="1190" y="350" fill="#c0f7d4" font-size="19" font-weight="700">선별기도 정상</text><text x="1190" y="413" fill="#f5fff7" font-size="31" font-weight="700">대부분 탈락</text><text x="1190" y="464" fill="#cde7d4" font-size="20">채널 경계 밖이라</text><text x="1190" y="494" fill="#cde7d4" font-size="20">캐서 바로 버림</text></g><g stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round"><path d="M465 455h115"/><path d="M990 455h115"/></g><g fill="#e5ffe9"><path d="M554 436l28 19-28 19z"/><path d="M1079 436l28 19-28 19z"/></g><rect x="100" y="740" width="1400" height="74" rx="22" fill="#213129" stroke="#6d8c72" stroke-opacity=".65"/><text x="140" y="788" fill="#effff2" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="600">수리: 설명문을 현재 전략의 씨앗·경계와 맞추고, 바뀐 뒤 실제 후보 분포를 다시 잰다. 설명문은 수요 검증을 대체하지 않는다.</text></svg>
