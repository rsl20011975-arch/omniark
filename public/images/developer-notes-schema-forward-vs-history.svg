<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">새 코드 수정과 과거 콘텐츠 복구의 차이</title>
  <desc id="desc">새 주입 코드가 앞으로의 글만 고치며, 과거 글은 별도의 전수 조사와 범위 제한된 복구가 필요함을 보여 준다.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#263449"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".5"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="116" fill="#f4f8ff" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="700">새 코드 수정은 과거 콘텐츠를 자동으로 고치지 않는다</text><text x="102" y="164" fill="#c3d0e4" font-family="Pretendard, Arial, sans-serif" font-size="24">앞으로 생성될 것과 이미 저장된 것은 다른 범위다. 복구에는 전수 확인과 범위 제한이 필요하다.</text>
  <g filter="url(#s)" font-family="Pretendard, Arial, sans-serif"><rect x="100" y="270" width="510" height="360" rx="30" fill="#24425f" stroke="#7db6ff" stroke-opacity=".7"/><text x="140" y="336" fill="#b8dcff" font-size="19" font-weight="700">앞으로 · 생성 경로</text><text x="140" y="402" fill="#f5fbff" font-size="34" font-weight="700">주입 코드 수정</text><path d="M156 470h360" stroke="#81c8ff" stroke-width="5" stroke-linecap="round"/><path d="M476 452l30 18-30 18" fill="none" stroke="#d9efff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="548" fill="#c8ddea" font-size="21">다음 새 글부터 새 값을 사용</text>
  <rect x="990" y="270" width="510" height="360" rx="30" fill="#493654" stroke="#d8b4fe" stroke-opacity=".7"/><text x="1030" y="336" fill="#ead7ff" font-size="19" font-weight="700">과거 · 이미 저장된 글</text><text x="1030" y="402" fill="#fff9ff" font-size="34" font-weight="700">별도 복구 경로</text><text x="1030" y="470" fill="#e2d3e7" font-size="21">전수 조사 → 미리보기 → 범위 치환</text><text x="1030" y="508" fill="#e2d3e7" font-size="21">→ 전수 재조회 → 시점 다른 표본</text><text x="1030" y="565" fill="#f6c9ff" font-size="19" font-weight="600">생성 AI가 아니라 정확한 문자열만 다룸</text></g>
  <path d="M646 450h290" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 14"/><path d="M903 429l34 21-34 21" fill="none" stroke="#d9ddff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="404" fill="#d8defe" font-family="Pretendard, Arial, sans-serif" font-size="21" font-weight="600">새 코드만으로 건너지 못하는 시간</text>
  <g font-family="Pretendard, Arial, sans-serif" filter="url(#s)"><rect x="290" y="716" width="1020" height="92" rx="24" fill="#1b2b3e" stroke="#6e91b7" stroke-opacity=".65"/><text x="334" y="754" fill="#cfe7ff" font-size="19" font-weight="700">복구 완료의 증거</text><text x="334" y="790" fill="#f1f8ff" font-size="25" font-weight="600">대상 전체에서 옛 값이 사라졌는가? 그리고 서로 다른 시점의 공개 글에서도 같은가?</text></g>
</svg>
